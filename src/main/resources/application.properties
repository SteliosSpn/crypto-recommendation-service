spring.application.name=crypto-recommendation-service
crypto.prices.directory=classpath:data/prices

#Ratelimit configuration
ratelimit.maxTokens = 10
ratelimit.refilledTokens = 10
ratelimit.refillPeriod = 1

#JPA Query Caching
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=com.hazelcast.hibernate.HazelcastCacheRegionFactory
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.hazelcast.instance_name=hazelcast-instance

